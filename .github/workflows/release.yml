name: Release

# Tag a version and this ships it:
#   git tag -a v1.4.0 -m 'v1.4.0' && git push origin v1.4.0
# The tag must match VERSION in claudehop.py or the build job fails.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build the wheel and the sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: the tag and VERSION must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import claudehop; print(claudehop.VERSION)')"
          test "$tag" = "$ver" || { echo "tag $tag != VERSION $ver"; exit 1; }

      - run: pip install build
      - run: python -m build

      - name: the wheel installs and runs
        run: |
          set -euo pipefail
          pip install dist/*.whl
          hop --version | grep -qx "claudehop $(python -c 'import claudehop; print(claudehop.VERSION)')"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/claudehop-cli
    permissions:
      contents: read
      id-token: write   # lets PyPI check this run is the workflow it trusts; no token is stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Trusted publishing: PyPI trusts this repository, this workflow file and the
      # `pypi` environment (set up at pypi.org/manage/project/claudehop-cli/settings/publishing),
      # so there is no API token to store or leak.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  github-release:
    name: attach the build to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: upload the wheel and sdist to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A bare tag push has no release yet; create one so there is something to attach to.
          # Its notes are the version's own section of CHANGELOG.md, so a release made from a
          # tag alone still says what changed. A release written by hand first is left as it is.
          ver="${GITHUB_REF_NAME#v}"
          # The changelog is wrapped at 90 columns and release notes show every line break,
          # so wrapped lines are joined back into their paragraph or list item.
          awk -v v="$ver" 'index($0, "## [" v "]") == 1 {on = 1; next} on && /^## \[/ {exit} on {print}' \
            CHANGELOG.md \
            | awk '/^[[:space:]]*$/ {if (b != "") print b; print ""; b = ""; next}
                   /^(#|- |\* |[0-9]+\. |\||```)/ {if (b != "") print b; b = $0; next}
                   {sub(/^[[:space:]]+/, ""); b = (b == "" ? $0 : b " " $0)}
                   END {if (b != "") print b}' > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
