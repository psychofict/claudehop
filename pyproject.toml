[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The commands, the module and the repo are all `claudehop`; the distribution
# carries the -cli suffix because PyPI holds the bare name too close to an
# unrelated `claude-hop` project and refuses it.
name = "claudehop-cli"
dynamic = ["version"]
description = "Use several Claude Code accounts on one machine: hop the saved login in one keystroke, or run a different account in each terminal. One file, no dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ebenworks", email = "hello@ebenworks.co" }]
requires-python = ">=3.9"
dependencies = []
keywords = [
    "claude", "claude-code", "anthropic", "account-switcher", "multi-account",
    "claude-max", "claude-pro", "claude-team", "account-manager", "bedrock", "vertex-ai",
    "oauth", "credentials", "keychain", "cli", "developer-tools",
    "productivity", "shell", "terminal", "ai", "llm",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Topic :: Terminals",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/psychofict/claudehop"
Repository = "https://github.com/psychofict/claudehop"
Documentation = "https://github.com/psychofict/claudehop#readme"
Comparison = "https://github.com/psychofict/claudehop/blob/master/docs/comparison.md"
Changelog = "https://github.com/psychofict/claudehop/blob/master/CHANGELOG.md"
Discussions = "https://github.com/psychofict/claudehop/discussions"
"Security policy" = "https://github.com/psychofict/claudehop/blob/master/SECURITY.md"
Issues = "https://github.com/psychofict/claudehop/issues"
Author = "https://ebenworks.co/"

[project.scripts]
claudehop = "claudehop:console_main"
hop = "claudehop:console_main"

# One module, no dependencies, stdlib only — that is the whole point of it.
[tool.setuptools]
py-modules = ["claudehop"]

[tool.setuptools.dynamic]
version = { attr = "claudehop.VERSION" }

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
