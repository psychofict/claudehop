name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: compile
        run: python3 -m py_compile claudehop.py
      - name: test
        run: ./test/test-switch.sh

  package:
    name: build and install the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: pip install build
      - name: build sdist and wheel
        run: python -m build
      - name: install the wheel and run it
        run: |
          set -euo pipefail
          pip install dist/*.whl
          test "$(hop --version)" = "$(claudehop --version)"
          hop --version | grep -qx "claudehop $(python -c 'import claudehop;print(claudehop.VERSION)')"
          hop shell-init | bash -n -          # the glue it hands to pip users must parse
          CLAUDE_HOP_OFFLINE=1 CLAUDE_CONFIG_DIR="$RUNNER_TEMP/c" hop doctor --json | python -c 'import json,sys;json.load(sys.stdin)'
      - name: the sdist carries the installer and the tests
        run: |
          set -euo pipefail
          tar tzf dist/*.tar.gz | grep -q 'install.sh'
          tar tzf dist/*.tar.gz | grep -q 'test/test-switch.sh'
          tar tzf dist/*.tar.gz | grep -q 'shell/claudehop.sh'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: ruff
        run: ruff check claudehop.py
      - name: shellcheck
        run: shellcheck -S warning install.sh shell/claudehop.sh test/test-switch.sh
      - name: install and uninstall cleanly
        run: |
          set -euo pipefail
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          # start from a pre-1.2.0 install: the old glue line and the old binary
          printf 'export FOO=1\n[ -f "$HOME/.claude/claude-acct.sh" ] && source "$HOME/.claude/claude-acct.sh"\n' > "$RUNNER_TEMP/rc"
          mkdir -p "$CLAUDE_CONFIG_DIR/bin"
          touch "$CLAUDE_CONFIG_DIR/bin/claude-acct" "$CLAUDE_CONFIG_DIR/claude-acct.sh"
          ./install.sh --rc "$RUNNER_TEMP/rc"
          grep -q 'claudehop.sh' "$RUNNER_TEMP/rc"
          test "$(grep -c 'source' "$RUNNER_TEMP/rc")" = 1     # replaced, not stacked
          test ! -e "$CLAUDE_CONFIG_DIR/bin/claude-acct"       # old binary removed
          test -x "$CLAUDE_CONFIG_DIR/bin/claudehop"
          ./install.sh --rc "$RUNNER_TEMP/rc"                  # idempotent
          test "$(grep -c 'claudehop.sh' "$RUNNER_TEMP/rc")" = 1
          ./install.sh --uninstall --rc "$RUNNER_TEMP/rc"
          ! grep -q 'claudehop.sh' "$RUNNER_TEMP/rc"
          test ! -e "$CLAUDE_CONFIG_DIR/bin/claudehop"
