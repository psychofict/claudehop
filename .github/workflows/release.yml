name: Release

# Tag a version and this ships it:
#   git tag -a v1.4.0 -m 'v1.4.0' && git push origin v1.4.0
# The tag must match VERSION in claudehop.py or the build job fails.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build the wheel and the sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: the tag and VERSION must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import claudehop; print(claudehop.VERSION)')"
          test "$tag" = "$ver" || { echo "tag $tag != VERSION $ver"; exit 1; }

      - run: pip install build
      - run: python -m build

      - name: the wheel installs and runs
        run: |
          set -euo pipefail
          pip install dist/*.whl
          hop --version | grep -qx "claudehop $(python -c 'import claudehop; print(claudehop.VERSION)')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/claudehop
    permissions:
      id-token: write # trusted publishing — no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: attach the build to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: upload the wheel and sdist to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
